  <!-- Bloqueo estricto de pinch-to-zoom, gestos y zoom durante scroll para iPhone / iOS Safari -->
  <script>
    (function() {
      // Bloquear eventos de gestos nativos de WebKit (iOS)
      window.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      window.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      window.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      // Bloquear inicio de toques con 2 o más dedos
      window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Bloquear movimiento con 2 o más dedos durante el scroll
      window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Bloquear zoom derivado de trackpad o atajos con Ctrl
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // Bloquear zoom por doble toque rápido
      var lastTouchEnd = 0;
      window.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          if (!['INPUT', 'TEXTAREA', 'SELECT', 'A', 'BUTTON'].includes(e.target.tagName)) {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
