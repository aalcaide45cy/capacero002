name: Buscar vídeos nuevos (frecuencia elegida en el panel)

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::Sin secreto CRON_SECRET en GitHub: se omite (la búsqueda diaria la hace Vercel Cron)."
            exit 0
          fi
          status=$(curl -sS -m 60 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.capacero3d.com/api/cron-sync)
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "cron-sync respondió HTTP $status"
            exit 1
          fi
