name: Vigilante web y correo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      probar_correo:
        description: 'Enviar un correo de prueba'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/vigilante.py
      - name: Correo de prueba
        if: ${{ github.event.inputs.probar_correo == 'true' }}
        run: python3 scripts/vigilante.py --test-email
      - name: Vigilar
        run: python3 scripts/vigilante.py
